[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-audit-tools"
version = "1.0.0"
description = "Evidence-producing procurement audit tools, M01-M15"
requires-python = ">=3.11"
dependencies = ["pypdf>=6.0,<7", "pdfplumber>=0.11,<0.12", "Pillow>=11,<13", "python-docx>=1.1,<2"]

[project.optional-dependencies]
sp = ["langchain>=1,<2"]

[project.scripts]
bid-audit = "bid_audit.cli:main"

[tool.setuptools.packages.find]
include = ["bid_audit*"]
