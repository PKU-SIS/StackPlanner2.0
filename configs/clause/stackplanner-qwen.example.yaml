# Qwen/vLLM example; set endpoint/model/key through infer CLI environment.
# Verify model context capacity before increasing the character-based file limit.
config_version: 20
log_level: info
models:
- name: benchmark-model
  display_name: Benchmark API (injected by CLI)
  use: langchain_openai:ChatOpenAI
  model: injected-by-cli
  api_key: EMPTY
  supports_thinking: true
  supports_vision: false
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
tool_groups:
- name: file:read
- name: file:write
- name: bash
tools:
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  read_file_output_max_chars: 262144
skills:
  container_path: /mnt/skills
summarization:
  enabled: true
